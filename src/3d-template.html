body[data-ui="0"] #leader-mini,body[data-ui="0"] #chat,body[data-ui="0"] #sonar{display:none}body[data-ui="1"] #chat,body[data-ui="1"] #sonar{display:none}body[data-ui="2"] #sonar{display:block}body[data-ui="3"] #app:after,body[data-ui="4"] #app:after{content:"";position:absolute;z-index:2;inset:7px;border:1px solid #f7d89796;box-shadow:inset 0 0 28px #d9b27316;pointer-events:none}body[data-ui="4"] #app:after{border:2px solid #ffebbb;box-shadow:inset 0 0 36px #d9b2732b,0 0 24px #ffdc9d49}

<body data-ui="0">
<div id="app">

 <div id="charge" class="hidden"><strong>抛竿蓄力 · 松开左键</strong><div id="charge-track"><div id="charge-fill"></div></div></div>

</div>
<div id="event-banner"><span id="event-eyebrow"></span><strong id="event-title"></strong><small id="event-sub"></small></div>

</div>
