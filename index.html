<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#091c23">
  <title>深流 · 100人钓鱼淘汰赛</title>
  <style>
    :root { --accent:#8de6d8; --accent2:#e8bd7c; --ink:#e9f6f1; --panel:rgba(8,28,37,.73); --border:rgba(182,235,224,.17); }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#071b24; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    #app { position:relative; width:100%; height:100%; min-height:420px; overflow:hidden; isolation:isolate; }
    #world { display:block; width:100%; height:100%; cursor:crosshair; touch-action:none; }
    .grain { position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.16; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' seed='8' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E"); }
    #gear-frame { position:absolute; inset:12px; z-index:2; border:1px solid transparent; border-radius:12px; pointer-events:none; transition:border-color .5s,box-shadow .5s; }
    #gear-frame.tier-2 { border-color:rgba(135,239,209,.18); box-shadow:inset 0 0 50px rgba(87,223,194,.055); }
    #gear-frame.tier-3 { border-color:rgba(235,196,114,.42); box-shadow:inset 0 0 45px rgba(235,196,114,.09),0 0 23px rgba(235,196,114,.12); }
    #gear-frame.tier-4 { inset:9px; border:2px solid rgba(255,224,162,.66); box-shadow:inset 0 0 75px rgba(124,164,236,.12),inset 0 0 4px #ffdd9f,0 0 25px rgba(255,216,137,.24); animation:royal-pulse 3s ease-in-out infinite alternate; }
    #gear-frame.tier-4::before,#gear-frame.tier-4::after { content:'✧'; position:absolute; top:-13px; left:-9px; color:#ffe2a0; font-size:29px; text-shadow:0 0 14px #ffe2a0; }
    #gear-frame.tier-4::after { left:auto; right:-9px; transform:scaleX(-1); }
    @keyframes royal-pulse { to { border-color:rgba(255,226,169,.94); box-shadow:inset 0 0 86px rgba(124,164,236,.17),0 0 31px rgba(255,216,137,.4); } }
    #hud { position:absolute; inset:0; z-index:3; pointer-events:none; }
    .hidden { display:none!important; }
    .topbar { position:absolute; top:22px; left:28px; right:28px; display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
    .mark { display:flex; gap:12px; align-items:center; color:#ecf8f1; text-shadow:0 2px 15px #08252b; }
    .mark-icon { width:39px; height:39px; display:grid; place-items:center; border:1px solid rgba(222,250,238,.5); border-radius:11px; background:rgba(12,41,49,.5); font-size:20px; }
    .mark strong { display:block; font-family:Georgia,serif; letter-spacing:.17em; font-size:16px; line-height:1; }
    .mark small { display:block; margin-top:6px; color:#c1d8d4; font-size:9px; letter-spacing:.24em; }
    .meta { display:flex; align-items:center; gap:8px; }
    .pill { padding:9px 13px; min-height:39px; border:1px solid var(--border); border-radius:10px; background:var(--panel); box-shadow:0 8px 30px rgba(0,0,0,.13); backdrop-filter:blur(12px); font-size:11px; font-weight:750; letter-spacing:.07em; white-space:nowrap; }
    .pill em { color:var(--accent); font-style:normal; font-variant-numeric:tabular-nums; font-size:17px; margin-left:5px; }
    #clock.urgent em { color:#ff9d86; animation:pulse .8s infinite alternate; }
    @keyframes pulse { to { opacity:.45; } }
    #stage-label { position:absolute; left:50%; top:88px; transform:translateX(-50%); padding:6px 18px; border:1px solid rgba(233,246,241,.18); border-radius:20px; background:rgba(8,29,37,.49); color:#e8f4ec; font-size:11px; letter-spacing:.32em; white-space:nowrap; text-shadow:0 2px 9px #122; }
    #board { position:absolute; top:108px; right:25px; width:218px; padding:14px; border:1px solid var(--border); border-radius:14px; background:var(--panel); backdrop-filter:blur(16px); box-shadow:0 20px 45px #001a2470; opacity:0; transform:translateX(12px); transition:opacity .25s,transform .25s; }
    #board.visible { opacity:1; transform:translateX(0); }
    .board-toggle { position:absolute; top:76px; right:27px; padding:7px 10px; border:1px solid rgba(218,249,230,.21); border-radius:8px; background:rgba(8,29,37,.65); color:#d0eee3; font-size:10px; font-weight:800; letter-spacing:.04em; pointer-events:auto; }
    .board-toggle:hover { border-color:var(--accent); }
    #full-board { position:absolute; inset:0; z-index:8; display:grid; place-items:center; padding:16px; background:rgba(2,17,25,.79); backdrop-filter:blur(9px); }
    .full-card { width:min(640px,100%); max-height:min(710px,88vh); display:flex; flex-direction:column; padding:23px; border:1px solid rgba(171,226,207,.36); border-radius:16px; background:#0c2731; box-shadow:0 25px 90px #0009; }
    .full-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .full-head h2 { margin:5px 0; font-family:Georgia,"Noto Serif SC",serif; font-size:29px; font-weight:450; }
    .full-head button { padding:8px 12px; border:1px solid rgba(198,236,218,.3); border-radius:7px; background:#1b4049; color:#eff9ed; }
    #full-info { margin:10px 0 12px; color:#bbd2cb; font-size:11px; line-height:1.6; }
    #full-list { min-height:0; overflow:auto; scrollbar-color:#6daca0 #132f37; }
    .full-row { display:flex; align-items:center; gap:13px; padding:7px 10px; min-height:45px; border-bottom:1px solid rgba(218,245,222,.08); font-size:12px; }
    .full-row:last-child { border:0; }
    .full-row.safe-line { border-bottom:2px solid rgba(240,199,129,.62); }
    .full-row.me { border-radius:7px; background:rgba(239,205,138,.12); color:#ffe2ad; }
    .full-rank { width:27px; color:var(--accent); font-weight:850; font-variant-numeric:tabular-nums; }
    .full-avatar { display:grid; place-items:center; width:26px; height:26px; border-radius:7px; background:#315a62; color:#e0f6e6; font-size:13px; }
    .full-player { display:flex; flex:1; flex-direction:column; min-width:0; }
    .full-player strong,.full-player small { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .full-player strong { font-size:12px; }
    .full-player small { margin-top:2px; color:#96b2ae; font-size:10px; }
    .full-score { color:#f1dbac; font-weight:800; font-variant-numeric:tabular-nums; }
    .panel-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; color:#aac9c8; font-size:10px; font-weight:800; letter-spacing:.18em; }
    .board-row { display:flex; align-items:center; gap:7px; padding:7px 4px; border-bottom:1px solid rgba(255,255,255,.07); font-size:11px; }
    .board-row:last-child { border:0; }
    .board-row.me { color:#f9d68f; background:rgba(251,207,132,.08); border-radius:6px; }
    .board-row b { color:var(--accent); width:20px; font-size:10px; font-variant-numeric:tabular-nums; }
    .board-row span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    .board-row strong { color:#edf4e9; font-size:11px; font-variant-numeric:tabular-nums; }
    #feed { position:absolute; bottom:105px; left:28px; width:min(330px,34vw); padding:12px; border:1px solid var(--border); border-radius:12px; background:var(--panel); opacity:0; transition:opacity .3s; }
    #feed.visible { opacity:1; }
    .feed-line { padding:5px 0; color:#bedad6; font-size:11px; line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .feed-line b { color:var(--accent); font-weight:700; }
    #chat-box { position:absolute; left:28px; bottom:58px; z-index:4; width:min(325px,70vw); display:flex; gap:5px; pointer-events:auto; }
    #chat-input { width:100%; padding:9px 10px; border:1px solid rgba(186,234,228,.32); border-radius:8px; outline:0; background:rgba(9,29,37,.94); color:white; font-size:12px; }
    #chat-send { padding:0 11px; border:0; border-radius:8px; background:#9de3d2; color:#10363a; font-size:12px; font-weight:800; }
    #status { position:absolute; left:50%; bottom:26px; transform:translateX(-50%); max-width:calc(100% - 24px); padding:11px 18px; border:1px solid rgba(209,248,232,.25); border-radius:100px; background:rgba(6,29,35,.77); backdrop-filter:blur(12px); color:#edf6ea; text-align:center; white-space:nowrap; font-size:12px; letter-spacing:.035em; }
    #status strong { color:#f8d591; }
    #fight { position:absolute; left:50%; bottom:81px; transform:translateX(-50%); width:min(390px,80vw); padding:12px 16px; border:1px solid rgba(246,206,148,.43); border-radius:12px; background:rgba(10,29,35,.88); text-align:center; box-shadow:0 15px 40px #00192399; }
    #fight-name { color:#ffe0a8; font-size:13px; font-weight:800; }
    #fight-hint { margin-top:3px; color:#c5d7d3; font-size:11px; }
    .meter { height:8px; margin-top:10px; border-radius:10px; background:#4b5c5b; overflow:hidden; }
    .meter div { width:0; height:100%; border-radius:10px; background:linear-gradient(90deg,#77c8b6,#ffe19a); transition:width .12s; }
    .meter.danger div { background:linear-gradient(90deg,#f0b879,#f36d63); }
    #sonar { position:absolute; top:160px; left:28px; padding:11px 13px; border:1px solid rgba(163,244,216,.3); border-radius:10px; background:rgba(6,30,39,.68); color:#b6f9df; font-size:11px; line-height:1.6; }
    #touch-controls { position:absolute; z-index:5; right:18px; bottom:60px; display:none; gap:8px; pointer-events:auto; }
    #touch-controls button { padding:12px 14px; border:1px solid rgba(242,230,197,.55); border-radius:9px; background:rgba(7,35,43,.87); color:#f6e3bc; font-size:12px; font-weight:850; }
    #screen { position:absolute; inset:0; z-index:10; display:grid; place-items:center; padding:20px; background:linear-gradient(100deg,rgba(5,18,27,.91),rgba(6,29,39,.77) 56%,rgba(6,22,29,.52)); backdrop-filter:blur(4px); overflow:auto; }
    .screen-inner { width:min(660px,100%); margin:auto; animation:rise .4s ease-out; }
    @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:850; letter-spacing:.35em; }
    .hero-title { margin:16px 0 7px; font-family:Georgia,"Noto Serif SC",serif; font-size:clamp(56px,9vw,104px); font-weight:500; letter-spacing:-.065em; line-height:1.04; text-shadow:0 10px 40px #0006; }
    .hero-title span { color:#a2e8d9; }
    .subtitle { margin:0 0 25px; color:#c2d6d4; font-size:14px; letter-spacing:.09em; line-height:1.7; }
    .divider { width:46px; height:3px; margin:22px 0; border-radius:3px; background:#d7ad7b; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin:23px 0; }
    .btn { padding:13px 21px; border:1px solid rgba(245,250,235,.27); border-radius:9px; background:rgba(215,238,226,.07); color:#edf8f2; font-size:13px; font-weight:800; letter-spacing:.05em; transition:transform .15s,background .15s; }
    .btn:hover { transform:translateY(-2px); background:rgba(215,238,226,.14); }
    .btn.primary { border-color:#b5ead9; background:#adebd5; color:#143941; box-shadow:0 8px 30px #66d8bb36; }
    .btn.primary:hover { background:#c9f9e7; }
    .btn:disabled { opacity:.36; cursor:not-allowed; transform:none; }
    .rules { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0 13px; }
    .rule { padding:10px 12px; border:1px solid rgba(208,248,229,.13); border-radius:8px; background:rgba(202,240,223,.045); color:#bbd0cc; font-size:11px; }
    .footnote { color:#93aaa9; font-size:11px; line-height:1.6; }
    .profile-setup { display:flex; align-items:center; gap:13px; flex-wrap:wrap; margin:13px 0 2px; color:#b6d1cb; font-size:11px; }
    .profile-setup label { display:flex; align-items:center; gap:9px; }
    .profile-setup input { width:140px; padding:8px 10px; outline:none; border:1px solid rgba(168,227,205,.34); border-radius:7px; background:rgba(19,54,60,.85); color:#f5f9ea; font-size:12px; }
    .profile-setup input:focus { border-color:#b5ead9; }
    .profile-setup span { color:#e1bd86; letter-spacing:.07em; }
    .results-stat { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0; }
    .stat { min-width:110px; padding:12px 14px; border:1px solid rgba(225,244,226,.2); border-radius:9px; background:rgba(231,248,226,.07); }
    .stat small { display:block; color:#a0bcb8; font-size:10px; letter-spacing:.14em; }
    .stat strong { display:block; margin-top:5px; font-size:23px; font-variant-numeric:tabular-nums; }
    .shop-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .shop-head h2 { margin:8px 0; font-family:Georgia,serif; font-size:38px; font-weight:400; }
    .shop-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; max-height:min(52vh,480px); overflow:auto; padding-right:4px; scrollbar-color:#6c9c99 transparent; }
    .shop-card { padding:15px; border:1px solid rgba(169,225,215,.19); border-radius:11px; background:rgba(12,39,46,.76); }
    .shop-card.owned { border-color:rgba(136,230,187,.49); }
    .shop-card.charm { background:linear-gradient(135deg,rgba(40,50,70,.9),rgba(12,39,46,.78)); }
    .shop-card.equipped { border-color:rgba(236,197,130,.8); box-shadow:inset 0 0 24px rgba(236,197,130,.06); }
    .shop-guide { padding:10px 12px; margin:0 0 12px; border:1px solid rgba(236,197,130,.23); border-radius:8px; background:rgba(236,197,130,.07); color:#e9d8b3; font-size:11px; line-height:1.65; }
    .rarity { margin-bottom:7px; color:#e8ba7e; font-size:10px; font-weight:900; letter-spacing:.2em; }
    .shop-card h3 { margin:0 0 5px; font-size:16px; }
    .shop-card p { min-height:36px; margin:0 0 10px; color:#a8bfba; font-size:11px; line-height:1.55; }
    .cost { margin-bottom:11px; color:#e9d7ad; font-size:11px; }
    .shop-card .btn { width:100%; padding:9px; font-size:11px; }
    .inventory { margin:12px 0 18px; color:#d6e5db; font-size:11px; line-height:1.9; }
    .toast { position:absolute; z-index:11; left:50%; top:20%; transform:translate(-50%,-10px); padding:11px 18px; max-width:90%; border:1px solid rgba(241,221,177,.4); border-radius:10px; background:rgba(13,38,42,.9); color:#ffe0a1; font-size:13px; font-weight:700; pointer-events:none; opacity:0; transition:opacity .22s,transform .22s; white-space:nowrap; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    #stage-splash { position:absolute; z-index:5; left:50%; top:47%; display:flex; flex-direction:column; align-items:center; gap:8px; width:min(560px,90vw); padding:20px; transform:translate(-50%,-50%); opacity:0; pointer-events:none; text-align:center; text-shadow:0 4px 30px #001c2a; }
    #stage-splash::before { content:''; position:absolute; z-index:-1; inset:-25px -35px; border-radius:80px; background:radial-gradient(ellipse,rgba(4,29,40,.83),rgba(4,29,40,0) 70%); }
    #stage-splash span { color:var(--accent); font-size:11px; font-weight:850; letter-spacing:.48em; }
    #stage-splash strong { color:#fff8e7; font-family:Georgia,"Noto Serif SC",serif; font-size:clamp(33px,6vw,66px); font-weight:500; letter-spacing:.08em; }
    #stage-splash small { color:#e0f1e7; font-size:12px; letter-spacing:.12em; }
    #stage-splash.show { animation:stage-reveal 2.25s ease-in-out both; }
    @keyframes stage-reveal { 0% { opacity:0; filter:blur(8px); transform:translate(-50%,-40%) scale(.86); } 17%,70% { opacity:1; filter:blur(0); transform:translate(-50%,-50%) scale(1); } 100% { opacity:0; transform:translate(-50%,-58%) scale(1.05); } }
    @media (pointer:coarse) { #touch-controls { display:flex; } }
    @media (max-width:700px) {
      .topbar { top:12px; left:12px; right:12px; }
      .mark { display:none; }
      .topbar { justify-content:flex-end; }
      .pill { padding:8px 7px; min-height:35px; font-size:9px; }
      .pill em { font-size:13px; }
      .meta { gap:4px; }
      #stage-label { top:65px; font-size:9px; }
      .board-toggle { top:98px; right:11px; }
      #board { right:10px; top:134px; width:190px; }
      .full-card { max-height:85vh; padding:15px; }
      #feed { bottom:140px; left:10px; width:min(260px,67vw); }
      #status { bottom:16px; padding:9px 12px; font-size:10px; }
      #fight { bottom:102px; }
      .hero-title { font-size:65px; }
      .shop-grid { grid-template-columns:1fr; }
      .screen-inner { padding:12px 0; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="world" aria-label="鱼群向下游游动的河流；指向河面按住并松开以抛竿"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div id="gear-frame" aria-hidden="true"></div>
    <div id="hud" class="hidden">
      <div class="topbar">
        <div class="mark"><div class="mark-icon">◇</div><div><strong>深流 / DEEP CURRENT</strong><small id="profile-label">RIVER ROYALE · 离线模拟赛</small></div></div>
        <div class="meta"><div class="pill" id="clock">倒计时 <em>60</em></div><div class="pill">金币 <em id="gold">0</em></div><div class="pill">排名 <em id="rank">--</em></div></div>
      </div>
      <div id="stage-label">第 1 阶段 · 初潮浅滩 · 100 位选手</div>
      <button id="board-open" class="board-toggle" type="button" aria-label="查看完整排行榜">完整排行 · L</button>
      <div id="board"><div class="panel-title"><span>实时排名</span><span>TOP 5</span></div><div id="board-rows"></div><div class="footnote" style="margin-top:8px">本地模拟对手 · 按 Tab 显示 / 隐藏</div></div>
      <div id="feed"><div class="panel-title">河岸频道 · 按 Enter 发言</div><div id="feed-lines"></div></div>
      <div id="chat-box" class="hidden"><input id="chat-input" maxlength="60" placeholder="说点什么…（仅本地显示）" autocomplete="off"><button id="chat-send">发送</button></div>
      <div id="sonar" class="hidden"></div>
      <div id="fight" class="hidden"><div id="fight-name"></div><div id="fight-hint">快速按空格收线 · R 放生</div><div class="meter"><div id="progress-fill"></div></div><div class="meter danger"><div id="tension-fill"></div></div></div>
      <div id="status">按住鼠标左键 <strong>蓄力</strong>，松开抛竿 · 空格收线 · Tab 排行</div>
      <div id="touch-controls"><button id="touch-reel">连点收线</button><button id="touch-release">放生</button><button id="touch-chat">聊天</button></div>
    </div>
    <section id="full-board" class="hidden" role="dialog" aria-modal="true" aria-label="完整实时排行榜">
      <div class="full-card"><div class="full-head"><div><div class="eyebrow">LIVE STANDINGS · 离线模拟</div><h2>完整排行榜</h2></div><button id="board-close" type="button">关闭 ×</button></div><div id="full-info"></div><div id="full-list"></div></div>
    </section>
    <div id="stage-splash" aria-live="polite"><span id="splash-round"></span><strong id="splash-name"></strong><small id="splash-sub"></small></div>
    <div id="screen"><div class="screen-inner" id="screen-content"></div></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const canvas = $('world'), ctx = canvas.getContext('2d', { alpha:false });
    const app = $('app'), screen = $('screen'), screenContent = $('screen-content');
    const ROUNDS = 4, ROUND_TIME = 60, SAVE_KEY = 'deep-current-save-v1';
    const stages = [
      { name:'初潮浅滩', top:'#183f4b', water:'#1c7981', bottom:'#15525e', accent:'#8de6d8' },
      { name:'暮光洄湾', top:'#342d51', water:'#426b91', bottom:'#363755', accent:'#b4d5ff' },
      { name:'晶蓝深谷', top:'#102d51', water:'#146c9a', bottom:'#102f61', accent:'#74d9f3' },
      { name:'赤潮断崖', top:'#422337', water:'#873b58', bottom:'#3f263e', accent:'#ffb9a1' },
      { name:'星海王座', top:'#101d39', water:'#234476', bottom:'#111b3d', accent:'#ffdca0' }
    ];
    const species = [
      { id:'silver', name:'银尾鱼', shape:'minnow', size:18, value:6, need:1.3, tier:0, weight:29, speed:85, color:'#b9ebdf' },
      { id:'blue', name:'蓝鳞鱼', shape:'minnow', size:23, value:9, need:1.6, tier:0, weight:24, speed:70, color:'#78c7e5' },
      { id:'needle', name:'细吻针鱼', shape:'needle', size:25, value:10, need:1.5, tier:0, weight:18, speed:108, color:'#c5ddb0' },

    function postChat(name,text) {

    function botCatch(bot) {
      const power=2.1+bot.skill*.50+bot.risk*.32+stage*1.68;
      const pool=species.filter(s=>s.tier<=stage&&s.need<=power);
      if(!pool.length)return;
      const weighted=pool.map(s=>({s,w:speciesWeight(s)*clamp(1+(s.need-2.2)*(bot.style.large-1)*.34,.2,3.5)}));
      let roll=Math.random()*weighted.reduce((n,item)=>n+item.w,0);
      let kind=pool[0];
      for(const item of weighted){roll-=item.w;if(roll<=0){kind=item.s;break;}}
      const amount=Math.max(3,Math.round(kind.value*(1+stage*.15)*rand(.77,1.15)*(.8+bot.skill*.15)));
      bot.score+=amount;bot.catches++;bot.combo++;bot.lastCatch=gameClock;bot.lastFish=kind.name;
      if(kind.value>=70&&Math.random()<.25) postChat(bot.name,choice([`哇，${kind.name}上钩了！`,`这条${kind.name}差点把竿拉断`,`谁能想到这里有${kind.name}`]));
      else if(bot.combo>=3&&Math.random()<.10){postChat(bot.name,'连着三竿有鱼，今天这手感绝了');bot.combo=0;}
    }
    function updateBots(dt) {

        const desperate=timeLeft<16&&bot.score<=cutoffScore+5;
        bot.timer=rand(7,14)*bot.style.rate/Math.pow(bot.skill,.40)*(desperate?.70:1);
        if(Math.random()<bot.style.miss+(desperate?.1:0)){
          bot.misses++;bot.combo=0;
          if(bot.misses>=3&&Math.random()<.07)postChat(bot.name,'空了好几竿，我得换个钓点');
        } else botCatch(bot);
        if(Math.random()<.018)bot.quiet=rand(3,10); // Bathroom breaks and lost focus.
      }
      for(let i=pendingReplies.length-1;i>=0;i--){
        const reply=pendingReplies[i];

          postChat(bot.name,line);

      }
    }
    function transitionRound() {

    function castTarget(power) {
      const base=rodBase(), dx=pointer.x-base.x, dy=pointer.y-base.y, d=Math.max(1,Math.hypot(dx,dy));

      let x=base.x+dx/d*reach, y=base.y+dy/d*reach;
      y=clamp(y,50,H-42); x=clamp(x,riverLeft(y)+26,riverRight(y)-26);
      return {x,y};
    }
    function beginCharge(x,y) {

    function updateFishing(dt) {

    function drawStageDetails(t) {

          ctx.fillStyle=beam;ctx.beginPath();ctx.moveTo(x,-20);ctx.lineTo(x+21,-20);ctx.lineTo(x+124,H);ctx.lineTo(x+83,H);ctx.closePath();ctx.fill();

    function drawGround(t) {

      ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
      // River banks are drawn as winding silhouettes, keeping the moving water in the middle.
      const step=24;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(riverLeft(0),0);
      for(let y=step;y<=H+step;y+=step) ctx.lineTo(riverLeft(y),y);
      ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=['#183a38','#292d47','#142c48','#3c2534','#161e3b'][stage];ctx.fill();
      ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(riverRight(0),0);
      for(let y=step;y<=H+step;y+=step) ctx.lineTo(riverRight(y),y);
      ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=['#183537','#28283f','#182845','#332633','#18203b'][stage];ctx.fill();
      for(let side=0;side<2;side++) {
        ctx.beginPath();for(let y=0;y<=H+step;y+=step) {const x=(side?riverRight(y):riverLeft(y));if(!y)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
        ctx.strokeStyle=side?'rgba(154,233,211,.42)':'rgba(193,243,219,.5)';ctx.lineWidth=3;ctx.stroke();
      }

      ctx.fillStyle=stage>=4?'#5c5875':stage>=3?'#775560':'#967358';ctx.fillRect(-55,-60,Math.max(94,W*.17),Math.max(116,H*.2));
      ctx.strokeStyle='rgba(48,37,38,.45)';ctx.lineWidth=3;
      for(let y=-44;y<H*.2;y+=22){ctx.beginPath();ctx.moveTo(-55,y);ctx.lineTo(W*.17+38,y);ctx.stroke();}
      ctx.restore();
      const glow=ctx.createRadialGradient(W*.48,H*.48,40,W*.48,H*.48,Math.max(W,H)*.75);

    function drawFish(f,t) {

    // A real 3D model made from a tapered eight-sided mesh, projected with a

    function drawRod(t) {
      const pose=rodPose(), focal=Math.max(700,W*.78);
      const unproject=(p,z)=>({x:(p.x-W/2)*(focal+z)/focal,y:(p.y-H/2)*(focal+z)/focal,z});
      const project=p=>{const scale=focal/(focal+p.z);return{x:W/2+p.x*scale,y:H/2+p.y*scale,scale};};
      const near=unproject(pose.base,-205), far=unproject(pose.tip,320);
      const dx=far.x-near.x,dy=far.y-near.y,dz=far.z-near.z;
      const sideways=Math.hypot(dx,dy)||1;
      const normal={x:-dy/sideways,y:dx/sideways,z:0};

        x:near.x+dx*u+normal.x*Math.sin(Math.PI*u)*(5+pose.power*22),
        y:near.y+dy*u+normal.y*Math.sin(Math.PI*u)*(5+pose.power*22),

      const radius=u=>u<.29?10.2-u*7.2:Math.max(1.25,7*(1-u)+.4);
      const ring=(u,mult=1)=>{
        const c=spine(u),r=radius(u)*mult;

          return {x:c.x+(normal.x*Math.cos(a)+second.x*Math.sin(a))*r,
                  y:c.y+(normal.y*Math.cos(a)+second.y*Math.sin(a))*r,
                  z:c.z+(normal.z*Math.cos(a)+second.z*Math.sin(a))*r};
        });
      };
      const quality=activeGear.rodUi||0;
      const cork=['#956644','#bf925f','#e9c89a','#f6d6a1','#c69a6c','#795239','#6f4935','#a16c47'];
      const graphite=quality===0?['#324b48','#668474','#adbc92','#cfca96','#78846c','#3a554b','#233e3b','#526a55']:
        quality===1?['#4b5760','#8d9b9b','#c1dbcf','#f2e4b7','#8ea99e','#536e75','#34565e','#587980']:
        quality===2?['#164c60','#478fb4','#8cdaef','#c4f4ec','#56b5bc','#205779','#113e61','#2e7190']:
        quality===3?['#2b315d','#65539b','#c7a7e9','#f1d7aa','#8a68b1','#493c77','#252b52','#615382']:
        ['#353b75','#8578b0','#f6d9a0','#fff2bf','#cba583','#645a9d','#282e60','#927ba1'];
      const metal=quality>=3?['#655545','#af8550','#ffe2a0','#fff3c9','#dfbc73','#8a6b51','#524344','#bb9158']:
        ['#775e4e','#c3945c','#f5d499','#ffe4b5','#c69865','#806354','#58494b','#a67959'];
      const faces=[];

      for(let i=0;i<6;i++){const a=i*Math.PI/3+(hooked?t*5:0);ctx.beginPath();ctx.moveTo(front.x+Math.cos(a)*r*.17,front.y+Math.sin(a)*r*.17);ctx.lineTo(front.x+Math.cos(a)*r*.65,front.y+Math.sin(a)*r*.65);ctx.stroke();}
      ctx.fillStyle='#f4d39b';ctx.beginPath();ctx.arc(front.x,front.y,r*.18,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#e6c187';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(front.x,front.y);ctx.lineTo(front.x-r*.62,front.y+r*.83);ctx.lineTo(front.x-r*.36,front.y+r*1.04);ctx.stroke();

      if(activeGear.ui>=2){
        const tip=project(spine(.98));

        ctx.shadowBlur=activeGear.ui>=4?22:13;ctx.shadowColor=activeGear.ui>=3?'#ffd99e':'#a4f7f3';
        ctx.fillStyle=activeGear.ui>=3?'#ffe4ad':'#aaf6ec';ctx.beginPath();ctx.arc(tip.x,tip.y,activeGear.ui>=4?6:3.7,0,Math.PI*2);ctx.fill();
        if(activeGear.setBonus){ctx.lineWidth=1.2;ctx.strokeStyle=activeGear.school==='power'?'#f4cfa3':'#a8f4ea';ctx.beginPath();ctx.arc(front.x,front.y,r*1.3+Math.sin(t*3)*2,0,Math.PI*2);ctx.stroke();}
        ctx.shadowBlur=0;ctx.globalAlpha=1;
      }
      ctx.restore();
    }
    function drawFishing(t) {
      if (charge) {
        const p=castTarget(charge.power),tip=rodTip();
        ctx.save();ctx.setLineDash([5,8]);ctx.strokeStyle='rgba(248,228,166,.65)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(tip.x,tip.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.setLineDash([]);

    function drawPrediction(t) {

        const answer=/大鱼|巨鱼|深/.test(text)?choice(['等鱼游到你落点附近再抛，别追着它点','我现在也拉不动大鱼，先攒点鱼换竿吧','往鱼前面一点点抛，水流很快']):
          /装备|鱼竿|兑换/.test(text)?choice(['我在攒银尾鱼换青铜竿','商店得用对应的鱼换，金币只是积分','装备是下一局才生效，别买完在这局等']):
          choice(['加油！这轮一起晋级','有道理，我试试','我刚刚也这么想','祝你这一竿出大货','你说得对，往下游预判更稳']);
        pendingReplies.push({at:gameClock+rand(1.2,3.4),name:bot.name,text:answer});
      }
      notify('已发送到本地模拟频道');
    }
    $('chat-send').addEventListener('click',sendChat);
    $('board-open').addEventListener('click',()=>toggleFullBoard(true));
    $('board-close').addEventListener('click',()=>toggleFullBoard(false));
    $('full-board').addEventListener('click',event=>{if(event.target===$('full-board'))toggleFullBoard(false);});
    $('touch-reel').addEventListener('pointerdown',event=>{event.preventDefault();reelTap();});
    $('touch-release').addEventListener('click',()=>{if(hooked)releaseFish('已主动放生，继续寻找合适的鱼');});
    $('touch-chat').addEventListener('click',()=>{if(mode==='playing'){$('chat-box').classList.remove('hidden');$('chat-input').focus();}});
    window.addEventListener('keydown',event=>{
      if(mode!=='playing')return;
      if(event.key==='Escape'&&!$('full-board').classList.contains('hidden')){toggleFullBoard(false);return;}
      if(document.activeElement===$('chat-input')) {
        if(event.key==='Enter'){event.preventDefault();sendChat();}
        if(event.key==='Escape'){$('chat-box').classList.add('hidden');$('chat-input').blur();}
        return;
      }
      if(event.code==='Space'){event.preventDefault();if(!event.repeat)reelTap();}
      else if(event.key.toLowerCase()==='r'&&hooked)releaseFish('已主动放生，试试钓更小的鱼');
      else if(event.key==='Tab'){event.preventDefault();forceBoard=!forceBoard;updateHUD();}
      else if(event.key.toLowerCase()==='l'){event.preventDefault();toggleFullBoard($('full-board').classList.contains('hidden'));}
      else if(event.key==='Enter'){event.preventDefault();$('chat-box').classList.remove('hidden');$('chat-input').focus();}
    });
    resize(); renderMenu(); requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
